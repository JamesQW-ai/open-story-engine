[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "open-story-engine"
version = "0.1.0"
description = "State-authoritative interactive fiction runtime"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
api = ["fastapi==0.141.1", "uvicorn==0.52.4"]
api-test = ["httpx==0.28.1"]

[project.scripts]
open-story-play = "open_story_engine.entrypoints:play"
open-story-co-create = "open_story_engine.entrypoints:co_create"
open-story-validate = "open_story_engine.entrypoints:validate"
open-story-evaluate-live = "open_story_engine.entrypoints:evaluate_live"

[tool.setuptools.packages.find]
include = ["open_story_engine*"]

[tool.setuptools.package-data]
"open_story_engine.prompts" = ["manifest.json", "*/*.md"]
